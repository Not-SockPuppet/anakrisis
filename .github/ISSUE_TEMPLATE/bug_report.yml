name: Bug report
description: Report incorrect behavior in the server or doctrine evaluation
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, do not file a public issue — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did the tool do, and what did you expect instead?
      placeholder: MissionBrief returned tier X for these inputs; I expected tier Y.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The tool call and inputs (goal, constraints, etc.). Redact any real personal data.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release tag or commit SHA you are running.
    validations:
      required: true
  - type: dropdown
    id: python
    attributes:
      label: Python version
      options: ["3.10", "3.11", "3.12", "3.13", "other"]
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      description: e.g. Claude Desktop, Claude Code, LM Studio, Docker MCP Gateway.
