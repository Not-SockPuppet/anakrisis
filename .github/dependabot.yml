version: 2
updates:
  # Keep GitHub Actions pinned versions current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    labels: ["dependencies"]

  # Keep the Dockerfile base image current.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"
    labels: ["dependencies"]

  # Keep Python dependencies current. Grouped so routine bumps arrive as one PR.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"
    labels: ["dependencies"]
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # mcp 2.x relocated mcp.server.fastmcp, which this server imports, so a
      # major bump breaks startup. Remove this rule when migrating to mcp 2.x.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
