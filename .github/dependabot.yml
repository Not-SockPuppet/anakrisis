version: 2
updates:
  # Keep GitHub Actions pinned versions current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    labels: ["dependencies"]

  # Keep the Dockerfile base image current.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"
    labels: ["dependencies"]

  # Keep Python dependencies current. Grouped so routine bumps arrive as one PR.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"
    labels: ["dependencies"]
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
