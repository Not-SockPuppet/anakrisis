name: Release

# Publishes to PyPI when a version tag is pushed (e.g. v0.1.0).
#
# Authentication uses PyPI Trusted Publishing (OIDC): PyPI is configured to
# trust this repository and workflow, so no API token is stored in the repo.
# See https://docs.pypi.org/trusted-publishers/

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment gates the release; PyPI's trusted publisher config
    # references this environment name.
    environment:
      name: pypi
      url: https://pypi.org/p/anakrisis
    permissions:
      # Required for OIDC trusted publishing.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
