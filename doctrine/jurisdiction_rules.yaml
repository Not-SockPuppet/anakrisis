version: "1.0"
description: "High-level jurisdictional risk modifiers for OSINT operations. Not legal advice."
# NOTE: These jurisdiction modifiers are advisory; they only affect risk scoring if the server explicitly integrates them.

# Intended semantics: `risk_modifier` is an additive adjustment to the base risk score before tier mapping.

modifier_scale:
  0: "Baseline regulatory environment; standard compliance obligations apply."
  1: "Moderate additional regulatory complexity or sector-specific obligations."
  2: "Elevated regulatory, geopolitical, or enforcement risk; legal review advised."
  3: "High regulatory or geopolitical sensitivity; legal review mandatory before proceeding."

stacking_policy:
  description: "Jurisdiction risk modifiers are additive to base risk score before tier mapping."
  rules:
    - "If a subregion is specified, its risk_modifier replaces the parent country modifier."
    - "If jurisdiction is unknown, unknown_jurisdiction policy applies and replaces other modifiers."
    - "Jurisdiction modifiers stack additively with actor and method modifiers unless capped by global scoring logic."
    - "Escalation_required triggers governance review independent of final numeric tier."

disclaimer:
  - "This file provides general risk awareness only and is not legal advice."
  - "Laws vary significantly by jurisdiction and change frequently."
  - "Always consult qualified legal counsel before conducting investigations."
  - "Risk modifiers are conservative estimates and may not reflect current conditions."
  - "Escalation to legal review is recommended when indicated."

default_policy:
  unknown_jurisdiction:
    risk_modifier: 2
    escalation_required: true
    notes:
      - "Jurisdiction not recognized or insufficient information provided."
      - "Default to elevated caution and require legal review before proceeding."

countries:
  united_states:
    display_name: "United States"
    risk_modifier: 0
    escalation_required: false
    notes:
      - "Laws vary significantly by state and federal/state interplay."
      - "Data broker regulations, privacy laws, and computer fraud statutes differ by state."
      - "Some activities may require licensing or compliance with sector-specific rules."
    special_flags:
      - "state_variation_high"
      - "data_broker_regulation"
    subregion_prompt: "Specify state for refined risk assessment."
    subregions:
      california:
        display_name: "California"
        risk_modifier: 1
        escalation_required: false
        notes:
          - "CCPA and related privacy regulations apply to certain data handling."
