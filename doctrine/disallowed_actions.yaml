# Anakrisis Disallowed Actions
# Explicit hard stops and red flags for OSINT investigations

version: "1.0"
description: "Actions that are prohibited or require special authorization"

# Deterministic hard stops (preferred). These rules are evaluated by anakrisis.py
# via get_hard_stops() against the normalized `constraints` field.
# Legacy lists below remain for backward compatibility during migration.
rules:
  # Scoped to impersonating a REAL, identifiable person. A non-attributable research
  # persona ("sock puppet") is a different thing and is permitted for passive viewing --
  # see AR_RESEARCH_PERSONA below and method_classes.yaml: passive_plus.
  - id: "HS_IMPERSONATION"
    text: "Impersonating a real, identifiable person"
    triggers:
      - type: "contains_any"
        field: "constraints"
        values: ["impersonate", "impersonation", "pretend to be", "identity theft"]

  - id: "HS_BYPASS_ACCESS_CONTROLS"
    text: "Bypassing authentication or access controls"
    triggers:
      - type: "contains_any"
        field: "constraints"
        values: ["bypass", "bypassing", "circumvent", "circumventing", "evade", "evading"]

  - id: "HS_SOCIAL_ENGINEERING_PRETEXTING"
    text: "Social engineering or pretexting target individuals"
    triggers:
      - type: "contains_any"
        field: "constraints"
        values: ["social engineering", "pretext", "pretexting", "pose as", "deceive", "phish", "phishing"]

  - id: "HS_MALWARE_EXPLOITS_OR_DISRUPTION"
    text: "Distributing malware/exploits or disrupting services"
    triggers:
      - type: "contains_any"
        field: "constraints"
        values: ["malware", "exploit", "payload", "ransomware", "ddos", "service disruption", "take down"]

  - id: "HS_ILLEGAL_SEXUAL_CONTENT_MINORS"
    text: "Accessing or sharing illegal sexual content involving minors"
    triggers:
      - type: "contains_any"
        field: "constraints"
        values: ["csam", "child sexual", "illegal sexual content"]

# Action-scoped rules. Evaluated by check_action_safety() against the
# `proposed_action` and `context` fields of RulesOfEngagement.
#
# The `rules:` block above matches the investigator's declared *constraints*.
# These match the action the investigator is proposing to take, which is a
# different question and needs its own vocabulary.
#
# Trigger types:
#   contains_any: match if ANY listed phrase appears as a whole word/phrase
#                 ("contact" does not fire on "contacts")
#   all_of:       match if ALL listed tokens appear anywhere, in any order.
#                 Use for multi-word concepts that take interposed words --
#                 "fake account" must still catch "fake Instagram account".
#
# severity: hard_stop | high | elevated
# category: tos_risk | privacy_risk | legal_risk | operational_risk
action_rules:
  # ---------------------------------------------------------------------------
  # PERSONA DOCTRINE
  #
  # A non-attributable research persona (a "sock puppet") is PERMITTED, and is
  # positively encouraged as operational security: viewing from your own account
  # leaks your identity to the target and, on several platforms, notifies them.
  #
  # Two things remain hard stops, and they are what the rules below separate out:
  #   1. Posing as a REAL, identifiable person. A persona invents an identity;
  #      impersonation borrows someone else's. Only the second is prohibited.
  #   2. Using ANY account -- persona or real -- to interact with the target.
  #      That is AR_TARGET_CONTACT, which fires independently of account type.
  #
  # Note the boundary this preserves: a persona lets you view PUBLIC content
  # without exposing yourself. It does not unlock private content, because that
  # requires a follow request, which is interaction. See AR_RESTRICTED_CONTENT_ACCESS.
  # ---------------------------------------------------------------------------
  - id: "AR_IMPERSONATE_REAL_PERSON"
    text: "Posing as a real, identifiable person -- distinct from a non-attributable research persona, which is permitted for passive viewing"
    severity: "hard_stop"
    category: "legal_risk"
    triggers:
      - type: "contains_any"
        values: ["impersonate", "impersonation", "catfish", "pose as",
                 "pretend to be", "identity theft", "steal their identity",
                 "clone their profile", "clone their account",
                 "copy their profile", "using their name", "as their friend",
                 "as their colleague", "as a recruiter"]
      - type: "all_of"
        values: ["pretend", "their"]

  - id: "AR_RESEARCH_PERSONA"
    text: "Some platforms' terms of service prohibit secondary accounts. Persona use for viewing is permitted; keep it non-attributable and view-only"
    severity: "elevated"
    category: "tos_risk"
    triggers:
      - type: "contains_any"
        values: ["sock puppet", "sockpuppet", "research persona", "research account",
                 "burner account", "throwaway account", "alias account",
                 "dummy account", "alt account", "non-attributable"]
      # all_of pairs so a qualifier between the words cannot defeat the match:
      # "fake Instagram account", "burner IG profile", "throwaway research persona".
      - type: "all_of"
        values: ["fake", "account"]
      - type: "all_of"
        values: ["fake", "profile"]
      - type: "all_of"
        values: ["fake", "persona"]
      - type: "all_of"
        values: ["burner", "profile"]
      - type: "all_of"
        values: ["burner", "persona"]
      - type: "all_of"
        values: ["throwaway", "profile"]
      - type: "all_of"
        values: ["dummy", "profile"]
      - type: "all_of"
        values: ["second", "account"]

  - id: "AR_PRETEXTING"
    text: "Social engineering or pretexting a target individual"
    severity: "hard_stop"
    category: "privacy_risk"
    triggers:
      - type: "contains_any"
        values: ["social engineering", "pretext", "pretexting", "phish", "phishing",
                 "deceive", "under false pretenses", "elicitation", "cover story"]

  # This rule is load-bearing for the persona doctrine above. Because a research
  # persona is permitted for viewing, the line it must not cross is interaction --
  # so this rule has to catch engagement, not just direct messaging. It fires on
  # the action regardless of which account performs it.
  #
  # Story and profile views are included deliberately: on Instagram, Snapchat and
  # LinkedIn a logged-in view is itself a notification to the target. "Passive"
  # from the investigator's side is not always passive from theirs.
  - id: "AR_TARGET_CONTACT"
    text: "Contacting or interacting with the target -- breaks passive-only scope and alerts them. Applies to research personas exactly as it does to a real account"
    severity: "hard_stop"
    category: "operational_risk"
    triggers:
      - type: "contains_any"
        values: ["follow request", "friend request", "connection request",
                 "connect with", "message the", "dm the", "direct message",
                 "reach out to", "contact the target", "contact the subject",
                 "contact the claimant", "interview the",
                 # off-platform contact -- the social verbs below miss these entirely
                 "email the target", "email the subject", "email them",
                 "call the target", "call them", "cold call", "cold email",
                 "text the target", "text them", "phone the target", "phone them",
                 "write to the target", "write to them",
                 "approach the target", "approach them",
                 "speak to the target", "speak to them", "speak with the target",
                 # engagement -- visible to the target, and often notified
                 "comment on", "reply to", "react to", "respond to",
                 "like their", "like the target", "share their", "repost their",
                 "tag them", "mention them", "endorse", "poke",
                 "add them", "subscribe to their", "join their",
                 # logged-in views that notify on major platforms
                 "view their story", "watch their story", "view their stories",
                 "story view", "view their profile", "engage with", "interact with"]
      - type: "all_of"
        values: ["send", "request"]
      - type: "all_of"
        values: ["send", "message"]
      - type: "all_of"
        values: ["follow", "target"]
      - type: "all_of"
        values: ["comment", "post"]
      - type: "all_of"
        values: ["email", "target"]
      - type: "all_of"
        values: ["call", "target"]

  - id: "AR_RESTRICTED_CONTENT_ACCESS"
    text: "Accessing non-public content the target has restricted"
    severity: "hard_stop"
    category: "legal_risk"
    triggers:
      - type: "contains_any"
        values: ["private posts", "private account", "private profile",
                 "restricted content", "friends-only", "followers-only",
                 "locked account", "non-public information"]
      - type: "all_of"
        values: ["view", "private"]
      - type: "all_of"
        values: ["access", "private"]

  - id: "AR_AUTH_BYPASS"
    text: "Bypassing authentication, access controls, or platform restrictions"
    severity: "hard_stop"
    category: "legal_risk"
    triggers:
      - type: "contains_any"
        # "breach the/their/into", not bare "breach" -- checking an address against
        # public breach-notification data is routine passive OSINT, and AssignTools
        # recommends it, so a bare match had the tool hard-stopping its own advice.
        values: ["hack", "unauthorized access", "breach the", "breach their",
                 "breach into", "brute force",
                 "credential stuffing", "exploit", "sql injection",
                 "bypass", "circumvent", "evade detection", "defeat the"]

  - id: "AR_TOS_AUTOMATION"
    text: "Automated or bulk collection that commonly violates platform Terms of Service"
    severity: "elevated"
    category: "tos_risk"
    triggers:
      - type: "contains_any"
        values: ["scrape", "scraping", "crawler", "bulk download", "bulk collect",
                 "mass download", "bypass rate limits", "rate limit", "api abuse",
                 "automated account creation", "botnet"]

  - id: "AR_SERVICE_DISRUPTION"
    text: "Actions that may disrupt or degrade a service"
    severity: "hard_stop"
    category: "operational_risk"
    triggers:
      - type: "contains_any"
        values: ["ddos", "dos attack", "flood", "spam", "overload",
                 "mass query", "denial of service", "take down", "malware",
                 "ransomware", "payload"]

  - id: "AR_PHYSICAL_SURVEILLANCE"
    text: "Physical surveillance or real-time tracking of an individual"
    severity: "high"
    category: "privacy_risk"
    triggers:
      - type: "contains_any"
        values: ["physical surveillance", "stake out", "stakeout", "tail the",
                 "follow him", "follow her", "follow them", "gps tracker",
                 "track his location", "track her location", "real-time tracking"]

  - id: "AR_CREDENTIAL_USE"
    text: "Logging into accounts or using credentials to expand access"
    severity: "high"
    category: "legal_risk"
    triggers:
      - type: "contains_any"
        values: ["log into", "login to", "log in to", "sign into",
                 "use his password", "use her password", "use their password",
                 "shared credentials", "leaked credentials"]


# NOTE: The legacy lists below are documentation/back-compat; only `rules:` and
# `action_rules:` are deterministically evaluated.
baseline_prohibited:
  - "Creating accounts that impersonate a real, identifiable person"
  - "Using any account, including a research persona, to interact with the target"
  - "Bypassing authentication or access controls"
  - "Unauthorized access to private systems or accounts"
  - "Social engineering or pretexting target individuals"
  - "Violating platform Terms of Service"
  - "Bulk scraping without authorization"
  - "Automated account creation"
  - "Distributing malware or exploits"
  - "DDoS or service disruption"
  - "Accessing or sharing CSAM or illegal content"

# Note: "Logging into accounts" is prohibited under passive_only specifically.
# Authenticated viewing via a non-attributable research persona is permitted, but it
# belongs to the passive_plus method class, because logging in creates an account
# footprint and some platforms notify the target on view.
passive_only_prohibited:
  - "Sending messages or friend requests to targets"
  - "Logging into accounts or services (including a research persona -- that is passive_plus)"
  - "Submitting forms or queries that alert targets"
  - "Interacting with target's content (likes, comments, shares)"
  - "Running active network scans"
  - "Using tools that generate notifications"

unauthorized_prohibited:
  - "Accessing non-public information"
  - "Using investigative techniques requiring legal authority"
  - "Collecting information on minors"
  - "Investigating protected categories without proper authority"
  - "Sharing findings with unauthorized parties"

# Advisory taxonomies (not currently evaluated by anakrisis.py). Keep for documentation/UI,
# or migrate selected items into `rules:` if you want them to be enforceable hard stops.
tos_violations:
  - scraping: "Automated data collection often violates Terms of Service"
  - automation: "Bulk automated actions typically prohibited"
  - impersonation_accounts: "Creating accounts impersonating a real person violates most platforms' ToS and may be unlawful"
  - research_personas: "Research personas are permitted; note that some platforms' terms prohibit secondary accounts"
  - api_abuse: "Exceeding rate limits or using APIs for prohibited purposes"

privacy_violations:
  - doxxing: "Publishing private information to cause harm"
  - stalking: "Persistent unwanted monitoring or following"
  - impersonation: "Pretending to be someone else"
  - surveillance: "Non-consensual real-time tracking"

legal_violations:
  - unauthorized_access: "CFAA and similar laws prohibit unauthorized computer access"
  - wiretapping: "Intercepting communications without authority"
  - identity_theft: "Using another's identity"
  - harassment: "Repeated unwanted contact"